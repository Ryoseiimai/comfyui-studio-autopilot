name: pdca

on:
  schedule:
    # 3時間おき（GitHub cronは混雑時に数時間遅れることがある前提で運用する）
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=DRY_RUN（Claudeを呼ばずops/stub_agent.pyで配管確認・無料） / 0=本番実行"
        type: choice
        options:
          - "1"
          - "0"
        default: "0"

concurrency:
  group: pdca
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pdca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Determine dry_run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Fetch state from Drive
        run: |
          mkdir -p work/state work/context
          rclone copy "ryosei_google_drive:AI素材/ComfyUIスタジオ/PDCA" work/state/ || true
          rclone copyto "ryosei_google_drive:AI素材/ComfyUIモデル倉庫/README.md" work/context/warehouse_README.md || true
          rclone copyto "ryosei_google_drive:AI素材/ComfyUIモデル倉庫/.state/harvester.json" work/context/harvester_state.json || true

      - name: Bootstrap default state (deterministic, only fills what's missing)
        run: python -m ops.bootstrap_state

      - name: Gate scheduled Claude runs
        id: gate
        run: python -m ops.gate

      - name: Remove rclone.conf before untrusted agent step
        run: rm -f ~/.config/rclone/rclone.conf

      - name: Install Claude Code
        if: steps.mode.outputs.dry_run != '1' && steps.gate.outputs.skip != 'true'
        run: npm i -g @anthropic-ai/claude-code

      - name: Run PDCA agent (Claude)
        if: steps.mode.outputs.dry_run != '1' && steps.gate.outputs.skip != 'true'
        id: run_claude
        # continue-on-error: Claude実行が失敗（利用枠切れ等）してもguard以降の決定論
        # フェーズを必ず走らせるため。ジョブ全体の成否は最後の
        # 「Fail job if PDCA agent step failed」ステップで正しく反映する。
        continue-on-error: true
        run: |
          set +e
          claude -p "$(cat ops/prompt.md)" --model sonnet --max-turns 80 \
            --dangerously-skip-permissions --no-session-persistence < /dev/null > work/claude_out.txt 2>&1
          agent_exit=$?
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          exit "$agent_exit"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          USER: runner

      - name: Run stub agent (dry_run substitute for Claude)
        if: steps.mode.outputs.dry_run == '1'
        run: python -m ops.stub_agent

      # 以降は if: always() で必ず実行する。Claude実行ステップが失敗した場合に
      # ここから下（guard/executor/KPI再計算/Drive書き戻し/日報）がまるごと
      # スキップされると、失敗した事実がDrive・Issueのどこにも残らない
      # サイレント失敗になる（2026-09-27 検証run 36276915948で実際に発生・要修正点として発見）。
      - name: Guard (deterministic enforcement of protected paths / secrets / size)
        if: always()
        run: python -m ops.guard

      - name: Restore rclone.conf for executor
        if: always()
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Executor (allow-listed drive_write / hf_fetch / gpu_generate)
        if: always()
        run: python -m ops.executor
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Recompute KPI and dashboard (before pushing state back to Drive)
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.run_claude.outcome }}
          AGENT_FINISHED_AT: ${{ steps.run_claude.outputs.finished_at }}
        run: |
          python -m ops.kpi
          python -m ops.report --dashboard-only

      - name: Push state back to Drive
        if: always()
        run: rclone copy work/state/ "ryosei_google_drive:AI素材/ComfyUIスタジオ/PDCA"

      - name: Remove rclone.conf (no longer needed)
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf

      - name: Handle code changes (branch -> PR -> test -> squash merge)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "no repo changes this cycle"
            exit 0
          fi

          branch="pdca/auto-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "pdca-autopilot[bot]"
          git config user.email "pdca-autopilot@users.noreply.github.com"
          # checkoutをpersist-credentials:falseにしているため、決定論フェーズ(ここ)でだけ
          # 明示的にトークンを差し込んでpushする（未検証コード実行中のClaudeにはgit書き込み権限を渡さない）。
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout -b "$branch"
          git add -A
          git commit -m "PDCA: automated cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$branch"

          pr_url=$(gh pr create --base main --head "$branch" \
            --title "PDCA自動サイクル $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "GitHub Actions PDCAエージェントによる自動変更。テスト合格後にその場でsquash mergeされる。")
          pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')

          if pip install -r requirements.txt && python -m pytest -q; then
            gh pr merge "$pr_number" --squash --delete-branch
          else
            echo "tests failed on $pr_url; leaving PR open for human review"
          fi

      - name: Daily report (JST21時以降・1日1回だけIssueへ5行以内)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ops.report

      - name: Fail job if PDCA agent step failed
        if: always() && steps.run_claude.outcome == 'failure'
        run: |
          echo "::error::Run PDCA agent (Claude) step failed this cycle (see that step's log for detail, e.g. session limit). Guard/executor/KPI/Drive push/report still ran via if: always()."
          exit 1
